name: Release

permissions:
  contents: write

on:
  release:
    types:
      - published
env:
  PROGRAM: read2mind

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Build frontend
        working-directory: frontend
        run: deno task build
      - name: Upload frontend dist
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  build:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - filename: x86_64-linux.tar.gz
            target: x86_64-unknown-linux-gnu
            build_with: cross
          - filename: x86_64-windows.zip
            target: x86_64-pc-windows-msvc
            os: windows-latest
            build_with: cargo
          - filename: aarch64-linux.tar.gz
            target: aarch64-unknown-linux-gnu
            build_with: cross
          - filename: x86_64-apple-darwin.tar.gz
            target: x86_64-apple-darwin
            os: macos-latest
            build_with: cargo
          - filename: aarch64-apple-darwin.tar.gz
            target: aarch64-apple-darwin
            os: macos-latest
            build_with: cargo

    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: "${{ matrix.target }}"
      - name: Install cross
        run: cargo install cross
        if: matrix.build_with == 'cross'

      - name: Build
        working-directory: backend
        run: ${{ matrix.build_with }} build --release --locked --target ${{ matrix.target }}

      - name: Download frontend dist
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: backend/target/${{ matrix.target }}/release/public

      - name: Package
        shell: bash
        run: |
          cd backend/target/${{ matrix.target }}/release
          cp ../../../config.toml.local-llm.example .
          cp ../../../config.toml.openai.example .
          cp ../../../../README.md .
          case ${{ matrix.target }} in
          *-pc-windows-*)
            7z -y a ${{ env.PROGRAM }}-${{ matrix.filename }} ${{ env.PROGRAM }}.exe public README.md config.toml.openai.example config.toml.local-llm.example
            ;;
          *)
            tar czf ${{ env.PROGRAM }}-${{ matrix.filename }} ${{ env.PROGRAM }} public README.md config.toml.*.example
            ;;
          esac;

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: backend/target/${{ matrix.target }}/release/${{ env.PROGRAM }}-*
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
